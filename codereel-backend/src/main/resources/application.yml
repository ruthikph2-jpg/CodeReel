spring:
  application:
    name: codereel-backend

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:codeReelDb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

logging:
  level:
    com.codereel: DEBUG
    org.springframework.security: WARN

codereel:
  execution:
    timeout-seconds: 10
    max-output-bytes: 65536
    max-steps: 500
